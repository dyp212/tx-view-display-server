
server:
  port: 9000

spring:
  main:
    web-application-type: reactive
  application:
    name: tx-view-display-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8     # 连接池最大连接数
          max-idle: 8       # 连接池最大空闲连接数
          min-idle: 0       # 连接池最小空闲连接数
          max-wait: -1ms    # 连接池最大阻塞等待时间 (负值表示没有限制)
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 10000
        response-timeout: 100s
        pool:
          type: elastic
          max-connections: 500
          acquire-timeout: 45000
      routes:
        - id: tx-view-display-auth
          uri: lb://tx-view-display-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: tx-view-display-system
          uri: lb://tx-view-display-system
          predicates:
            - Path=/system/**
#          metadata:
#            response-timeout: 12000
#            connect-timeout: 10000
          filters:
            - StripPrefix=1
#            - name: CircuitBreaker
#              args:
#                name: systemCircuitBreaker
#                fallbackUri: forward:/fallback/system
        - id: tx-view-display-cus
          uri: lb://tx-view-display-cus
          predicates:
            - Path=/cus/**
          filters:
            - StripPrefix=1
        - id: tx-view-display-policy
          uri: lb://tx-view-display-policy
          predicates:
            - Path=/policy/**
          filters:
            - StripPrefix=1



resilience4j:
  timelimiter:
    instances:
      systemCircuiBreaker:
        timeout-duration: 125s
  circuitbreaker:
    instances:
      systemCircuitBreaker:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        slow-call-rate-threshold: 50
        slow-call-duration-threshold:
          seconds: 10




logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
    com.alibaba.cloud.nacos: DEBUG
    reactor.netty: DEBUG
    org.springframework.security: DEBUG
    reactor.netty.http.server: DEBUG

